# ──────────────────────────────────────────────────────────
# Deploy to GitHub Pages（官方推荐方式）
#
# 此工作流使用 GitHub 官方的 Pages 部署 actions，
# 兼容 "GitHub Actions" 和 "Deploy from a branch" 两种源配置。
#
# ⚠️ 配置步骤（必须完成！）：
#    1. 进入 GitHub 仓库 → Settings → Pages
#    2. Source 选择 "GitHub Actions"（推荐）
#    3. 保存
#
# 如果之前配置的是 "Deploy from a branch" + "gh-pages"：
#    → 请改为 "GitHub Actions"，本工作流会自动处理部署
#
# gh-pages 分支说明：
#    - 如果存在 gh-pages 分支，它是之前 peaceiris 方式遗留的
#    - 使用新工作流后不再需要 gh-pages 分支，可以安全删除
#    - 删除方法: git push origin --delete gh-pages
#
# ──────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许只有一个部署运行，跳过中间的排队
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_BASE_PATH: /nwalmolos

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la out/
          echo "=== index.html check ==="
          head -5 out/index.html
          echo "=== .nojekyll check ==="
          ls -la out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
