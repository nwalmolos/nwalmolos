# ──────────────────────────────────────────────────────────
# Deploy to GitHub Pages
#
# 此工作流会在推送到 main 分支时自动构建并部署静态站点。
# 部署目标：gh-pages 分支（这是 GitHub Pages 的发布源）
#
# ⚠️ 重要：gh-pages 分支是自动生成的，不要手动修改或删除！
#    GitHub Pages 会从 gh-pages 分支读取内容并发布。
#
# 配置步骤：
#    1. 进入 GitHub 仓库 → Settings → Pages
#    2. Source 选择 "Deploy from a branch"
#    3. Branch 选择 "gh-pages" + "/ (root)"
#    4. 保存
#
# 如果部署失败，检查：
#    - Settings → Pages → Source 是否选择了 gh-pages
#    - Actions 页面是否有报错
#    - package-lock.json 是否存在（npm ci 需要）
# ──────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_BASE_PATH: /nwalmolos

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la out/
          echo "=== _next static ==="
          ls -la out/_next/static/chunks/ || echo "No chunks!"
          echo "=== index.html check ==="
          head -5 out/index.html
          echo "=== .nojekyll check ==="
          ls -la out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
