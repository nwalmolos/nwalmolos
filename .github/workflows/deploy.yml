name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_BASE_PATH: /nwalmolos

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Add CNAME (optional)
        run: echo "" > out/CNAME

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la out/
          echo "=== _next static ==="
          ls -la out/_next/static/chunks/ || echo "No chunks!"
          echo "=== index.html check ==="
          head -5 out/index.html
          echo "=== .nojekyll check ==="
          ls -la out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
